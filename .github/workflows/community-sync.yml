name: Community Sync Pipeline
run-name: 🔍 Community Sync Pipeline

on:
  schedule:
    # Cover 07:00-23:40 California time across PST and PDT.
    # The boundary hour outside the local window is skipped below.
    - cron: "*/20 14-23 * * *"
    - cron: "*/20 0-7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false

jobs:
  sync-community:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check California sync window
        id: calendar
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour="$(TZ=America/Los_Angeles date +%H)"
          if (( 10#$hour >= 7 && 10#$hour <= 23 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping community sync outside 07:00-23:40 California time."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # ✅ Checkout repository
      - name: Checkout repository
        if: steps.calendar.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      # ✅ Setup pnpm
      - name: Setup pnpm
        if: steps.calendar.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      # ✅ Setup Node.js
      - name: Setup Node.js
        if: steps.calendar.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # ✅ Install dependencies
      - name: Install dependencies
        if: steps.calendar.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # ✅ Check configuration
      - name: Check configuration
        if: steps.calendar.outputs.should_run == 'true'
        run: pnpm jobctl setup check-config

        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAT: ${{ secrets.PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          LOG_PRETTY: "1"

      # ✅ Run community sync pipeline
      - name: Run community sync pipeline
        if: steps.calendar.outputs.should_run == 'true'
        id: sync
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAT: ${{ secrets.PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          LOG_PRETTY: "1"
        run: |
          pnpm jobctl sync

          if [[ -n "$(git status --porcelain data/ 2>/dev/null)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No new jobs found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # ✅ Cancel workflow if no changes
      - name: Cancel workflow if no changes
        if: steps.calendar.outputs.should_run == 'true' && steps.sync.outputs.has_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel ${{ github.run_id }}

      # ✅ Commit and push updated data
      - name: Commit and push updated data
        if: steps.calendar.outputs.should_run == 'true' && steps.sync.outputs.has_changes == 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add data/
          git commit -m "chore(community): update new jobs"

          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
