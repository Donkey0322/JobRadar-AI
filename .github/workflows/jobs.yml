name: Jobs Pipeline
run-name: 🔍 Jobs Pipeline

# Scan and community sync share this workflow. One runner checks out once.
# The gate reads no git history. Setup runs only when the gate says to work.
# Later steps deepen the shallow clone when a commit, parent, or merge base
# is missing. Board refresh may add another commit, so notify keeps the saved
# data SHA.
on:
  schedule:
    # ATS scan. Cover every California weekday hour across PST and PDT.
    # Minute 10 sits midway between community sync runs at :00, :20, and :40.
    # One DST boundary run lands on a California weekend and is skipped by the gate.
    - cron: "10 7-23 * * 1"
    - cron: "10 8-23 * * 2-5"
    - cron: "10 0-7 * * 2-6"
    # Community sync. Cover 07:00-23:40 California time across PST and PDT.
    # The boundary hour outside the local window is skipped by the gate.
    - cron: "*/20 14-23 * * *"
    - cron: "*/20 0-7 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Pipeline to run
        required: true
        type: choice
        options:
          - scan
          - sync

permissions:
  contents: write
  actions: write

# queue: max keeps every waiting run, up to 100, instead of replacing the
# single pending run. Issue, Maintenance, and Publish data changes must each
# run. Scheduled Jobs and Batch could be superseded by a later schedule, but
# they share this queue so a later schedule cannot cancel a waiting issue.
# Publish and batch steps run here, so they do not take this lock again.
# A scheduled Batch Pipeline stays queued until this run ends.
#
# Step budgets kept from the separate jobs: gate 5, fetch 30, each publish
# 5+10+10, batch gate 5, submit 30, collect 30, and a second publish. The
# job cap is their sum so joining them on one runner does not cut the run off.
concurrency:
  group: job-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Choose scan or sync
        id: calendar
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node .github/scripts/workflow-route.mjs jobs-gate

      - name: Setup pnpm and Node
        id: setup
        if: ${{ success() && !cancelled() && steps.calendar.outputs.should_run == 'true' }}
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        id: config
        if: ${{ success() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: pnpm jobctl setup check-config

      - name: Fetch jobs
        id: fetch
        timeout-minutes: 30
        if: ${{ success() && !cancelled() && steps.config.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
          TASK: ${{ steps.calendar.outputs.task }}
          LOOKBACK: ${{ steps.calendar.outputs.lookback_days }}
        run: |
          set -euo pipefail
          if [[ "$TASK" == "scan" ]]; then
            if [[ -z "$LOOKBACK" ]]; then
              echo "Scan lookback is missing."
              exit 1
            fi
            export DISCOVERY_LOOKBACK_DAYS="$LOOKBACK"
            pnpm jobctl scan
          elif [[ "$TASK" == "sync" ]]; then
            pnpm jobctl sync
          else
            echo "Unknown jobs task: $TASK"
            exit 1
          fi

          if [[ -n "$(git status --porcelain data/ 2>/dev/null || true)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new job data found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save data
        id: save
        if: ${{ success() && !cancelled() && steps.fetch.outcome == 'success' && steps.fetch.outputs.has_changes == 'true' }}
        env:
          TASK: ${{ steps.calendar.outputs.task }}
        run: |
          set -euo pipefail
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add data/
          if [[ "$TASK" == "scan" ]]; then
            git commit -m "chore(discovery): update new jobs"
          else
            git commit -m "chore(community): update new jobs"
          fi

      - name: Rebase and push data
        id: push
        if: ${{ success() && !cancelled() && steps.save.outcome == 'success' }}
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Record saved data commit
        id: saved
        if: ${{ success() && !cancelled() && steps.push.outcome == 'success' }}
        run: echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish saved data
        id: publish
        if: ${{ success() && !cancelled() && steps.saved.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/publish-saved
        with:
          data_sha: ${{ steps.saved.outputs.data_sha }}
          notify: "true"
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Check whether queued or inflight work exists
        id: batch_due
        if: ${{ success() && !cancelled() && steps.fetch.outcome == 'success' && (steps.publish.outcome == 'success' || steps.publish.outcome == 'skipped') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/workflow-route.mjs batch-due

      - name: Run batch
        if: ${{ success() && !cancelled() && steps.batch_due.outputs.due == 'true' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/batch-work
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
