name: Publish Jobs
run-name: 📬 Publish Jobs

# Manual publish of one saved commit. Jobs, Batch, Add Job, and Publish data
# changes run the same action inside their own runner. Board fast-forwards to
# the branch tip. Notify keeps data_sha, or from_sha..data_sha. A board failure
# still notifies and fails this run. No concurrency group: a caller that
# already holds job-data-sync publishes inside its own job instead of here.
on:
  workflow_dispatch:
    inputs:
      data_sha:
        description: End of the notification range, or the saved data commit
        required: true
        type: string
      from_sha:
        description: Start of a direct-push range. Empty notifies data_sha as one commit.
        type: string
        default: ""
      notify:
        description: Send notifications when dashboard.notify allows it
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Fast-forward 5, board 10, notify 10.
    timeout-minutes: 25
    env:
      JOBRADAR_SUMMARY_DIR: ${{ runner.temp }}/jobradar-summary
    steps:
      - name: Require the saved data commit
        env:
          DATA_SHA: ${{ inputs.data_sha }}
        run: |
          if [[ -z "$DATA_SHA" ]]; then
            echo "A data commit SHA is required."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: pnpm jobctl setup check-config

      - name: Publish saved data
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/publish-saved
        with:
          data_sha: ${{ inputs.data_sha }}
          from_sha: ${{ inputs.from_sha }}
          notify: ${{ inputs.notify && 'true' || 'false' }}
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
          label: manual

      - name: Write run summary
        if: ${{ always() && !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/summary.mjs render || echo "::warning::Could not write the run summary. The task result is unchanged."
