name: Update README
run-name: 📬 Update README

on:
  push:
    paths:
      - "config.json"
      - "data/opportunities.ndjson"
      - "data/archive/opportunities-*.ndjson"
      - "scripts/readme.ts"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ✅ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      # ✅ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      # ✅ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # ✅ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ✅ Update README
      - name: Update README
        id: update-readme
        run: pnpm update-readme

      # ✅ Commit generated job board changes
      - name: Commit generated job board changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain -- README.md job-postings assets/featured-badges)" ]]; then
            echo "has_commit=false" >> "$GITHUB_OUTPUT"
            echo "No job board changes to commit."
            exit 0
          fi

          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add README.md job-postings assets/featured-badges
          git commit -m "docs: update generated job boards"
          echo "has_commit=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and push
        if: steps.commit.outputs.has_commit == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
