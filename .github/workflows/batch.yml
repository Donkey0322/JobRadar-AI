name: Batch Pipeline
run-name: 📦 Batch Pipeline

# Manual runs and the hourly recovery for inflight work or a queue written
# outside Jobs Pipeline. Jobs Pipeline calls batch-run.yml itself, so a queue
# commit does not start a second run. This caller holds job-data-sync; the
# reusable workflow does not, so the two cannot overwrite data and do not
# wait on each other. The shared gate skips submit, collect, and publish when
# the queue and inflight file are both empty, including this manual dispatch.
on:
  schedule:
    # Safety net if a run times out while batches are still inflight.
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  batch:
    uses: ./.github/workflows/batch-run.yml
    secrets: inherit
