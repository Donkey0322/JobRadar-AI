name: Add Job From Issue
run-name: 🧾 Add Job From Issue

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: write
  issues: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'add-job') || startsWith(github.event.issue.title, 'Add Job')
    runs-on: ubuntu-latest
    # Submission 10, publish 25, and one batch cycle of 115 minutes.
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-jobradar

      - name: Process submitted job
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LOG_PRETTY: "1"
        run: pnpm tsx scripts/github/add-job-from-issue.ts

      - name: Commit changes
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "has_commit=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "data: add job from issue #${{ github.event.issue.number }}"
          echo "has_commit=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and push
        id: push
        if: ${{ success() && !cancelled() && steps.commit.outputs.has_commit == 'true' }}
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Record saved data commit
        id: saved
        if: ${{ success() && !cancelled() && steps.push.outcome == 'success' }}
        run: echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish saved data
        id: publish
        if: ${{ success() && !cancelled() && steps.saved.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/publish-saved
        with:
          data_sha: ${{ steps.saved.outputs.data_sha }}
          notify: "true"
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Check whether queued or inflight work exists
        id: batch_due
        if: ${{ success() && !cancelled() && steps.commit.outcome == 'success' && (steps.publish.outcome == 'success' || steps.publish.outcome == 'skipped') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/workflow-route.mjs batch-due

      - name: Run batch
        if: ${{ success() && !cancelled() && steps.batch_due.outputs.due == 'true' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/batch-work
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

  finish:
    needs: process
    if: ${{ !cancelled() && needs.process.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment success
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Job submitted successfully and processed by JobRadar AI."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close issue
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "Closing this issue because the submitted job has been processed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-failure:
    needs: process
    if: ${{ !cancelled() && needs.process.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment failure
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "❌ Failed to process this job submission. Please check the workflow logs or update the issue fields."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
