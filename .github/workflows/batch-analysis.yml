name: Batch Analysis Pipeline
run-name: 📦 Batch Analysis Pipeline

on:
  push:
    paths:
      - "data/batch/queue.ndjson"
  schedule:
    # Safety net if a run times out while batches are still inflight.
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false

jobs:
  gate:
    # Collect may write failed jobs back to queue.ndjson. That push still
    # updates README / notify, but must not start another batch immediately.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(batch): collect') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Check whether queued or inflight work exists
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Manual run; skipping idle gate."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os

          def queue_has_jobs(path: str) -> bool:
              if not os.path.exists(path):
                  return False
              with open(path, encoding="utf-8") as handle:
                  return any(line.strip() for line in handle)

          def inflight_has_jobs(path: str) -> bool:
              if not os.path.exists(path):
                  return False
              payload = json.load(open(path, encoding="utf-8"))
              return isinstance(payload, list) and len(payload) > 0

          due = queue_has_jobs("data/batch/queue.ndjson") or inflight_has_jobs(
              "data/batch/inflight.json"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"due={'true' if due else 'false'}\n")

          print("Batch work is pending." if due else "No queued or inflight batch work.")
          PY

  batch-analysis:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration
        run: pnpm jobctl setup check-config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"

      - name: Submit queued jobs
        id: submit
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: |
          pnpm jobctl batch --submit-only

          if [[ -n "$(git status --porcelain data/ 2>/dev/null)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No batch submissions to checkpoint."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkpoint inflight submissions
        if: steps.submit.outputs.has_changes == 'true'
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add data/
          git commit -m "chore(batch): checkpoint inflight submissions [skip ci]"

      - name: Push inflight checkpoint
        if: steps.submit.outputs.has_changes == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Wait and collect batch results
        id: collect
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: |
          pnpm jobctl batch

          if [[ -n "$(git status --porcelain data/ 2>/dev/null)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No batch analysis changes."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit collected results
        if: steps.collect.outputs.has_changes == 'true'
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add data/
          git commit -m "chore(batch): collect batch analysis"

      - name: Push collected results
        if: steps.collect.outputs.has_changes == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
