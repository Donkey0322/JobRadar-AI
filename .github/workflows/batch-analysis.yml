name: Batch Analysis Pipeline
run-name: 📦 Batch Analysis Pipeline

on:
  schedule:
    # GitHub's shortest schedule is every 5 minutes. The job no-ops until
    # data/batch/schedule.json says the next adaptive check is due.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - name: Check whether the adaptive batch interval is due
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Manual run; skipping due-date gate."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "data/batch/schedule.json"
          due = True

          if os.path.exists(path):
              payload = json.load(open(path))
              next_check = payload.get("nextCheckAt")
              if isinstance(next_check, str) and next_check:
                  due = datetime.now(timezone.utc) >= datetime.fromisoformat(
                      next_check.replace("Z", "+00:00")
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"due={'true' if due else 'false'}\n")

          print("Batch check is due." if due else "Batch check is not due yet.")
          PY

  batch-analysis:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration
        run: pnpm jobctl setup check-config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"

      - name: Run batch analysis
        id: batch
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            pnpm jobctl batch --if-due
          else
            pnpm jobctl batch
          fi

          if [[ -n "$(git status --porcelain data/ 2>/dev/null)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No batch analysis changes."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.batch.outputs.has_changes == 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add data/
          git commit -m "chore(batch): collect and submit batch analysis"

          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
