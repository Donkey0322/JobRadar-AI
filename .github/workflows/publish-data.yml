name: Publish data changes
run-name: 📬 Publish data changes

# Direct edits of board inputs or job data. One checkout has the full history
# because the notification range can start at an older commit. The file check
# and the notification use that same before..after range. An existing branch
# uses github.event.before and github.sha, so a truncated webhook commit list
# does not shrink that range. A new branch has a zero before. The webhook
# commits array holds at most 2048 commits; the Events API timeline cap of 20
# does not apply to this payload. A shorter list is the whole push. A list of
# 2048 may be truncated, and the job fails instead of notifying from that list.
# Jobs and Batch push their own data commits with the built-in token, so GitHub
# does not create a run for those pushes. The job skip below still drops a PAT
# push of the same subjects, including Add Job. Maintenance and direct edits
# use a token that starts this workflow.
on:
  push:
    paths:
      - "config.json"
      - "data/jobs.ndjson"
      - "data/opportunities.ndjson"
      - "data/archive/opportunities-*.ndjson"
      - "src/modules/board/**"

permissions:
  contents: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      ${{
        !startsWith(github.event.head_commit.message, 'chore(discovery):') &&
        !startsWith(github.event.head_commit.message, 'chore(community):') &&
        !startsWith(github.event.head_commit.message, 'chore(batch): collect') &&
        !startsWith(github.event.head_commit.message, 'chore(batch): checkpoint') &&
        !startsWith(github.event.head_commit.message, 'data: add job from issue')
      }}
    runs-on: ubuntu-latest
    # Route 5 plus fast-forward 5, board 10, and notify 10.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Classify the pushed commit
        id: route
        timeout-minutes: 5
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PUSH_COMMITS: ${{ toJson(github.event.commits.*.id) }}
        run: node .github/scripts/workflow-route.mjs publish-route

      - name: Setup pnpm and Node
        id: setup
        if: ${{ success() && !cancelled() && steps.route.outputs.run == 'true' }}
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        id: config
        if: ${{ success() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: pnpm jobctl setup check-config

      - name: Publish saved data
        if: ${{ success() && !cancelled() && steps.config.outcome == 'success' }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
        uses: ./.github/actions/publish-saved
        with:
          data_sha: ${{ steps.route.outputs.data_sha }}
          from_sha: ${{ steps.route.outputs.from_sha }}
          notify: ${{ steps.route.outputs.notify }}
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
