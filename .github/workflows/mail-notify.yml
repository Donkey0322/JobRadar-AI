name: Notify Latest Jobs
run-name: 📬 Notify Latest Jobs

on:
  push:
    paths:
      - "data/jobs.ndjson"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: notify-jobs
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      send: ${{ steps.check.outputs.send }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # dashboard.notify is omitted on template installs, so those still email.
      # The public board sets it to false.
      - name: Check whether this repo sends notifications
        id: check
        run: |
          python3 <<'PY'
          import json
          import os

          config = json.load(open("config.json", encoding="utf-8"))
          notify = (config.get("dashboard") or {}).get("notify", True)
          send = "true" if notify else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"send={send}\n")

          print("Notifications disabled." if not notify else "Notifications enabled.")
          PY

  notify-jobs:
    needs: gate
    if: needs.gate.outputs.send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ✅ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # ✅ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      # ✅ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # ✅ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ✅ Check configuration
      - name: Check configuration
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAT: ${{ secrets.PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          LOG_PRETTY: "1"
        run: pnpm jobctl setup check-config

      # ✅ Notify jobs from current commit
      - name: Notify jobs from commit
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PAT: ${{ secrets.PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          LOG_PRETTY: "1"
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          pnpm jobctl notify commit "${{ github.sha }}"
