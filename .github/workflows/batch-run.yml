name: Batch Run
run-name: 📦 Batch Run

# Shared by Jobs Pipeline, issue submission, and the Batch Pipeline entry.
# No concurrency group: the caller already holds job-data-sync. A child in
# that same group would wait for the caller, and the caller would wait for
# the child.
on:
  workflow_call:

permissions:
  contents: write
  actions: write

jobs:
  gate:
    # [skip ci] on the checkpoint push suppresses this push trigger. Collect
    # pushes do not use that marker; ignore them here so they do not start
    # another batch. The checkpoint commit is published by publish-checkpoint.
    if: >-
      ${{
        github.event_name != 'push' ||
        (
          !startsWith(github.event.head_commit.message, 'chore(batch): collect') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      # Shared by every caller. github.event_name stays the caller's event, so a
      # manual Jobs run is still workflow_dispatch. Empty queue and inflight
      # skip submit, collect, and both publishes.
      - name: Check whether queued or inflight work exists
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/workflow-route.mjs batch-due

  submit:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checkpoint_publish: ${{ steps.checkpoint-route.outputs.run }}
      checkpoint_sha: ${{ steps.checkpoint-route.outputs.data_sha }}
      checkpoint_notify: ${{ steps.checkpoint-route.outputs.notify }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        run: pnpm jobctl setup check-config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"

      - name: Submit queued jobs
        id: submit
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: |
          set -euo pipefail
          pnpm jobctl batch --submit-only

          if [[ -n "$(git status --porcelain data/ 2>/dev/null || true)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No batch submissions to checkpoint."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkpoint inflight submissions
        if: steps.submit.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore(batch): checkpoint inflight submissions [skip ci]"

      - name: Push inflight checkpoint
        if: steps.submit.outputs.has_changes == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Classify checkpoint commit
        id: checkpoint-route
        if: steps.submit.outputs.has_changes == 'true'
        run: node .github/scripts/workflow-route.mjs classify-head

  publish-checkpoint:
    needs: submit
    if: needs.submit.result == 'success' && needs.submit.outputs.checkpoint_publish == 'true'
    uses: ./.github/workflows/publish-jobs.yml
    with:
      data_sha: ${{ needs.submit.outputs.checkpoint_sha }}
      notify: ${{ needs.submit.outputs.checkpoint_notify == 'true' }}
    secrets: inherit

  collect:
    # The checkpoint board push finishes before this job starts, so a later
    # board refresh cannot land behind it. Checkpoint publish does not wait
    # for this job. A failed or skipped checkpoint publish still continues.
    needs: [submit, publish-checkpoint]
    if: >-
      ${{
        always() &&
        needs.submit.result == 'success' &&
        (
          needs.publish-checkpoint.result == 'success' ||
          needs.publish-checkpoint.result == 'failure' ||
          needs.publish-checkpoint.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      collect_publish: ${{ steps.collect-route.outputs.run }}
      collect_sha: ${{ steps.collect-route.outputs.data_sha }}
      collect_notify: ${{ steps.collect-route.outputs.notify }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        run: pnpm jobctl setup check-config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"

      - name: Wait and collect batch results
        id: collect
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
        run: |
          set -euo pipefail
          pnpm jobctl batch

          if [[ -n "$(git status --porcelain data/ 2>/dev/null || true)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No batch analysis changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save collected results
        if: steps.collect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore(batch): collect batch analysis"

      - name: Push collected results
        if: steps.collect.outputs.has_changes == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}

      - name: Classify collected data commit
        id: collect-route
        if: steps.collect.outputs.has_changes == 'true'
        run: node .github/scripts/workflow-route.mjs classify-head

  publish-collect:
    needs: collect
    if: needs.collect.result == 'success' && needs.collect.outputs.collect_publish == 'true'
    uses: ./.github/workflows/publish-jobs.yml
    with:
      data_sha: ${{ needs.collect.outputs.collect_sha }}
      notify: ${{ needs.collect.outputs.collect_notify == 'true' }}
    secrets: inherit
