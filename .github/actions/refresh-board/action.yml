name: Refresh board
description: Regenerate the job board and commit it when the generated files change.

outputs:
  has_commit:
    description: Whether a board commit was created
    value: ${{ steps.commit.outputs.has_commit }}

runs:
  using: composite
  steps:
    - name: Refresh board
      id: commit
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${JOBRADAR_INSIDE_DEADLINE:-}" ]]; then
          export JOBRADAR_INSIDE_DEADLINE=1
          exec node .github/scripts/run-deadline.mjs 600 bash -e "${BASH_SOURCE[0]}"
        fi
        pnpm jobctl board refresh
        if [[ -z "$(git status --porcelain -- README.md job-postings assets/featured-badges)" ]]; then
          echo "has_commit=false" >> "$GITHUB_OUTPUT"
          echo "No job board changes to commit."
          node .github/scripts/summary.mjs append '{"stage":"board-commit","status":"success","committed":false}' || echo "::warning::Could not write the run summary. The task result is unchanged."
          exit 0
        fi

        git config user.name "actions-bot"
        git config user.email "actions@github.com"
        git add README.md job-postings assets/featured-badges
        git commit -m "docs: update generated job boards"
        echo "has_commit=true" >> "$GITHUB_OUTPUT"
        node .github/scripts/summary.mjs append '{"stage":"board-commit","status":"success","committed":true}' || echo "::warning::Could not write the run summary. The task result is unchanged."
