name: Rebase and push
description: Rebase onto the remote branch and push, retrying when another job moved the branch.

inputs:
  token:
    description: Token used to fetch and push
    required: true
  ref:
    description: Branch name to update
    required: true
  summary_label:
    description: Summary name for this push
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Rebase onto the remote branch and push
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.ref }}
        REPOSITORY: ${{ github.repository }}
        PUSH_LABEL: ${{ inputs.summary_label }}
      run: |
        set -euo pipefail
        bash .github/scripts/use-push-token.sh "$TOKEN" "$REPOSITORY"

        record_push() {
          PUSH_STATUS="$1" node .github/scripts/summary.mjs append-push \
            || echo "::warning::Could not write the run summary. The task result is unchanged."
        }

        plan_rebase() {
          local unshallowed="$1"
          local merge_base="false"
          local shallow="false"
          if git merge-base HEAD "origin/${BRANCH}" >/dev/null 2>&1; then
            merge_base="true"
          fi
          if [[ -f .git/shallow ]]; then
            shallow="true"
          fi
          MODE=rebase \
            SHALLOW="$shallow" \
            MERGE_BASE_PRESENT="$merge_base" \
            UNSHALLOWED="$unshallowed" \
            node .github/scripts/workflow-route.mjs history-plan
        }

        attempt=1
        max=8
        while true; do
          git fetch --no-tags origin "$BRANCH"
          unshallowed=false
          while true; do
            plan="$(plan_rebase "$unshallowed")"
            case "$plan" in
              ready)
                break
                ;;
              unshallow)
                echo "Shallow clone has no common ancestor with origin/${BRANCH}; fetching full history."
                git fetch --unshallow origin
                unshallowed=true
                ;;
              fail)
                echo "No common ancestor with origin/${BRANCH}. Refusing to push."
                record_push failure
                exit 1
                ;;
              *)
                echo "Unknown history plan: ${plan}"
                record_push failure
                exit 1
                ;;
            esac
          done

          git rebase "origin/${BRANCH}"
          if git push origin "HEAD:${BRANCH}"; then
            record_push success
            exit 0
          fi

          if (( attempt >= max )); then
            echo "Push failed after ${max} attempts."
            record_push failure
            exit 1
          fi

          echo "Remote branch moved; retrying rebase+push (${attempt}/${max})..."
          sleep $((attempt * 2))
          attempt=$((attempt + 1))
        done
